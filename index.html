<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/rally-01.png" />
    <link rel="apple-touch-icon" href="/brand/rally-01.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rally</title>
    <meta name="description" content="Rally: sessions, members and payments for your badminton group." />
    <style>
      /* Shown while the app downloads; React replaces it as soon as it starts. */
      .boot { min-height: 100vh; display: grid; place-items: center; background: #fbf8f3; }
      html.dark .boot { background: #15111f; }
      .boot img { animation: boot-bob 1.1s ease-in-out infinite; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      // Use the icon chosen for the app (remembered from the last visit) for the tab icon and splash.
      try {
        var i = localStorage.getItem('rallyIcon');
        if (i && /^rally-\d\d$/.test(i)) {
          var src = '/brand/' + i + '.png';
          document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function (l) { l.href = src; });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Rally">
        <img id="boot-icon" src="/brand/rally-01.png" width="72" height="72" alt="" draggable="false" style="border-radius: 25.5%" />
      </div>
    </div>
    <script>
      // The splash image only exists from here on, so set it now.
      try {
        var i = localStorage.getItem('rallyIcon');
        var b = document.getElementById('boot-icon');
        if (b && i && /^rally-\d\d$/.test(i)) b.src = '/brand/' + i + '.png';
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
